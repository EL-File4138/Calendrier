name = "calendrier-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true

# Durable Objects
[durable_objects]
bindings = [
  { name = "CALENDAR_DO", class_name = "CalendarDO" },
  { name = "ACTIVATION_TOKEN_DO", class_name = "ActivationTokenDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CalendarDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ActivationTokenDO"]

# KV Namespaces
[[kv_namespaces]]
binding = "CALENDAR_CACHE"
id = "76abf962e52b46e9937ef294e3236a7d"

[[kv_namespaces]]
binding = "ACTIVATION_TOKENS"
id = "68281a0471074e8cb4771a222d3372ca"

[[kv_namespaces]]
binding = "USERS"
id = "2cf943531ea04cbcb53b3c6f0a3a1a72"

# Secrets
# Set these using: wrangler secret put <SECRET_NAME>
# For development, add to .dev.vars file
# - ADMIN_MASTER_TOKEN: Master token for admin API authentication

# Build configuration
[build]
command = "npm run build"
